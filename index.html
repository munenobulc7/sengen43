                <div
                    style="margin: 20px 0; padding: 15px; background-color: var(--secondary-color); border-radius: 5px; border: 1px solid var(--primary-light);">

                    <p>当会では、住民の皆様の負担を最小限にするため、<strong>会費は一切徴収しておりません。</strong>自治体からの「自治振興業務委託料」を運営の原資とし、役員は区域内の時計回りの順番で公平に担当する体制をとっています。
                    </p>
